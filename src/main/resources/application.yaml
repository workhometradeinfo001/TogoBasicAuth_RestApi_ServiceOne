spring:
  application:
    name: TogoApi
  profiles:
    active: mysql, dev
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: default
      password: ${REDIS_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

googleOAuth:
  clientId: ${GOOGLE_CLIENT_ID}
  clientSecret: ${GOOGLE_CLIENT_SECRET}
  tokenEndPoint: https://oauth2.googleapis.com/token
  userInfoUrl: https://www.googleapis.com/oauth2/v3/userinfo
  # This MUST match what you used to get the code
  redirectUri: postmessage
